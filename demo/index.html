<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦门侧写师 · McProfiling — 点单即人格</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --green: #3fb950; --dim: #8b949e; --text: #e6edf3;
    --accent: #f0883e; --red: #f85149; --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
    padding: 24px; max-width: 860px; margin: 0 auto; line-height: 1.7;
  }
  header { border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; background: var(--panel); margin-bottom: 20px; }
  h1 { font-size: 20px; color: var(--green); letter-spacing: 1px; }
  h1 .cursor { display: inline-block; width: 10px; height: 18px; background: var(--green); animation: blink 1s steps(1) infinite; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }
  .sub { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .panel { border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; background: var(--panel); margin-bottom: 20px; }
  .panel h2 { font-size: 14px; color: var(--accent); margin-bottom: 14px; letter-spacing: 1px; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 4px; }
  select, input[type="text"] {
    width: 100%; background: #0d1117; border: 1px solid var(--line); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-family: inherit; font-size: 13px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    margin-top: 18px; width: 100%; padding: 12px; font-family: inherit; font-size: 14px;
    background: var(--green); color: #0d1117; border: none; border-radius: 6px;
    cursor: pointer; font-weight: bold; letter-spacing: 2px;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { background: var(--line); color: var(--dim); cursor: wait; }
  #report { white-space: pre-wrap; font-size: 13px; }
  #report .mod { color: var(--accent); font-weight: bold; }
  #report .p { display: block; min-height: 1.7em; }
  #report .quote { color: var(--yellow); }
  .badge { display: inline-block; border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; font-size: 11px; color: var(--dim); margin-left: 6px; }
  .order { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px; font-size: 13px; }
  .order .price { color: var(--red); font-weight: bold; }
  .order .mcp { color: var(--dim); font-size: 11px; }
  footer { color: var(--dim); font-size: 11px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <h1>MCD-PROFILER v2.0 <span class="cursor"></span><span class="badge">娱乐演绎 · 非真实心理评估</span></h1>
  <div class="sub">// 点单即人格。你点的每一份麦当劳，都是潜意识递出的自白书。</div>
</header>

<div class="panel">
  <h2>[ STEP 1 ] 输入点单碎片</h2>
  <div class="row">
    <div>
      <label>时间模态</label>
      <select id="time">
        <option value="早餐 · 秩序开局">工作日早晨</option>
        <option value="午后 · 偷来的闲暇">下午茶时段</option>
        <option value="深夜 · 当天兜底" selected>深夜加班后</option>
        <option value="周末 · 无政府时段">周末任意时间</option>
      </select>
    </div>
    <div>
      <label>场景模态</label>
      <select id="scene">
        <option value="独处" selected>独处</option>
        <option value="刚下班">刚下班</option>
        <option value="聚餐">和朋友聚餐</option>
        <option value="失恋补给">心情低落</option>
        <option value="庆祝">值得庆祝</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div>
      <label>辣度出口</label>
      <select id="spice">
        <option value="麦辣系" selected>麦辣鸡腿堡（辣）</option>
        <option value="板烧系">板烧鸡腿堡（不辣）</option>
        <option value="巨无霸系">巨无霸（经典）</option>
        <option value="1+1 组合">1+1 随心配</option>
      </select>
    </div>
    <div>
      <label>冰块变量</label>
      <select id="ice">
        <option value="去冰" selected>去冰</option>
        <option value="少冰">少冰</option>
        <option value="正常冰">正常冰</option>
        <option value="多冰">多冰</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div>
      <label>优惠反射弧</label>
      <select id="coupon">
        <option value="必查券" selected>下单前必查券</option>
        <option value="从不看券">从不看券，直接买</option>
        <option value="只记得大额券">只记得大额券，小券懒得领</option>
      </select>
    </div>
    <div>
      <label>加购冲动</label>
      <select id="addon">
        <option value="香芋派" selected>结算前加购香芋派</option>
        <option value="甜筒">单独买一个甜筒</option>
        <option value="不加">什么都不加，克制到底</option>
      </select>
    </div>
  </div>
  <label>补充碎片（可选）：一句话描述你的点单习惯</label>
  <input type="text" id="free" placeholder="例：我只吃薯条蘸冰淇淋，可乐必须去冰">
  <button id="go" onclick="profile()">▶ 启动侧写引擎</button>
</div>

<div class="panel" id="outPanel" style="display:none">
  <h2>[ STEP 2 ] 侧写报告 · INSIGHT CORE OUTPUT</h2>
  <div id="report"></div>
  <div class="order" id="order"></div>
</div>

<footer>麦门侧写师 · WaytoAGI 1024 用餐赛道 × 麦当劳程序员创意开发大赛参赛作品 · 报告为娱乐化演绎，不构成营养或医疗建议 · 真实下单请接入麦当劳 MCP（mcd-mcp）</footer>

<script>
const slices = [
  "你的手机在晚饭前后必然低于 20% 电量，且你从不带充电宝。",
  "薯条你只蘸番茄酱，且一定先吃掉最短的那一根。",
  "可乐剩三分之一必扔，你厌恶\"喝完一瓶\"的完整感。",
  "你的耳机里循环的不是歌单，是某三首歌，按固定顺序。",
  "拿餐后你不会立刻走，会在取餐台停留 4 秒，假装整理袋子。",
  "你点餐从不坐店内，打包是本能，座位是威胁。",
  "纸巾你只抽两张，一张垫着，一张备用，第二张大概率用不上。",
  "你知道自己常点的套餐编号，但每次都用手点图，假装第一次来。",
  "你的支付方式三年没换过，不是因为忠诚，是因为换的成本大于收益。",
  "吸管你戳三次才戳进去，你把这归咎于封膜，其实是仪式。",
  "你会在点单前刷新两次小程序，不是等新品，是在确认世界没变。",
  "吃汉堡你先吃边缘一圈，最后才碰中间，你连快乐都要延迟结算。"
];
const quotes = [
  "你用去冰证明克制，用一个派原谅自己——麦门收留每一个不肯认输的深夜。",
  "你点的不是套餐，是今天还能被修补的自己。",
  "辣是出口，冰是纪律，券是铠甲——你把生活过成了一套可优化的系统。",
  "别人在麦当劳填饱肚子，你在麦当劳核对自己在不在。",
  "固定套餐是给生活的锚，多要的那个派，才是船真正想去的地方。"
];
function pick(arr, n) {
  const a = [...arr];
  const r = [];
  while (r.length < n && a.length) r.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);
  return r;
}
function line(txt, cls) { return `<span class="${cls||''}">${txt}</span>\n`; }

function profile() {
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = "▶ 引擎运算中 ...";
  document.getElementById('outPanel').style.display = 'block';

  const time = document.getElementById('time').value;
  const scene = document.getElementById('scene').value;
  const spice = document.getElementById('spice').value;
  const ice = document.getElementById('ice').value;
  const coupon = document.getElementById('coupon').value;
  const addon = document.getElementById('addon').value;
  const free = document.getElementById('free').value.trim();

  let html = "";
  // 模块一
  html += line("【点单硬件与底层电压】","mod");
  html += line(`时空读数：${time}，场景：${scene}。`);
  html += line(`你选择${spice}，这表明${spice.includes("辣") ? "你正在为无处安放的攻击性寻找合法出口" : "你拒绝用味觉代价换取任何东西，稳定高于刺激是你此刻的生存代码"}。`);
  html += line(`电压判定：${scene==="庆祝" ? "高电压 surplus，快乐正在外溢" : scene==="失恋补给" ? "缺电抢修中，你在用碳水进行应急供电" : "标称电量充足，但属于负债运行"}。`);
  html += line("");
  // 模块二
  html += line("【模态解码与防御机制】","mod");
  html += line(`显性人设：「随便吃点的人」。`);
  html += line(`防线之下：你选${ice}，这不是口味，是${ice==="去冰" ? "纪律" : ice==="多冰" ? "对麻木的主动订购" : "适度的自我协商"}。`);
  if (addon !== "不加") html += line(`结算前加购${addon}的那 0.8 秒，才是今晚唯一一次心跳漏拍。`);
  else html += line(`什么都不加，是克制，也是今天你对自己最狠的一处细节。`);
  if (free) html += line(`你补写的碎片「${free}」，文字颗粒度暴露出：你远比你承认的更在意细节。`);
  html += line("");
  // 模块三
  html += line("【散弹枪高频切片】","mod");
  pick(slices, 8).forEach(s => html += line("· " + s));
  html += line("");
  // 模块四
  html += line("【口味信任鉴权】","mod");
  html += line(`今晚你的身体只信任：盐分与${spice.includes("辣") ? "灼烧感" : "熟悉感"}。`);
  html += line(`你的优惠反射弧（${coupon}）表明：${coupon==="必查券" ? "你把资源焦虑管理得井井有条，薅券是你的主权声明" : coupon==="从不看券" ? "你在用金钱购买\"不算计\"的自我形象，这很贵" : "你对小额收益的耐心正在耗尽，这值得警惕"}。`);
  html += line("");
  // 模块五
  html += line("【降维进食协议】","mod");
  html += line(`进食窗口：敞开，倒计时约 40 分钟。`);
  html += line(`人格套餐裁定：${spice}（可乐${ice}）${addon!=="不加" ? " + " + addon + " 1 份" : ""}。`);
  html += line(`今晚允许自己：坐下吃完，不看手机。这不奢侈，这叫止血。`);
  html += line("");
  // 模块六
  html += line("【麦门金句】","mod");
  html += line(pick(quotes,1)[0], "quote");

  const rep = document.getElementById('report');
  rep.innerHTML = html;

  const price = (29 + Math.floor(Math.random()*12) + 0.5).toFixed(2);
  document.getElementById('order').innerHTML =
    `<div>▸ MCP 执行序列：<span class="mcp">now-time-info → query-nearby-stores → query-meals → available-coupons → calculate-price → create-order</span></div>` +
    `<div>▸ 人格套餐：${spice}（可乐${ice}）${addon!=="不复"&&addon!=="不加" ? " + " + addon : ""}　用券后应付 <span class="price">¥${price}</span></div>` +
    `<div class="mcp">※ 本页为离线演示，价格由本地模拟生成。接入 mcd-mcp 并配置 MCP Token 后，SKILL.md 将驱动真实菜单查询、领券、计价与下单。</div>`;

  btn.disabled = false; btn.textContent = "▶ 重新侧写";
}
</script>
</body>
</html>
